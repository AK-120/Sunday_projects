name: Build Meeting Scribe APK

# Runs on every push. The finished APK appears under "Artifacts" on the run page
# (Actions tab). Download it, copy it to the phone and install it.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MeetingScribe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe-debug-apk
          path: MeetingScribe/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: MeetingScribe/app/build/reports
          if-no-files-found: ignore
