name: Build Meeting Scribe APK

# Runs on every push. The finished APK appears under "Artifacts" on the run page
# (Actions tab). Download it, copy it to the phone and install it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MeetingScribe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe-debug-apk
          path: MeetingScribe/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeetingScribe-debug.apk
          gh release create "apk-build-${{ github.run_number }}" MeetingScribe-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Meeting Scribe debug APK (build ${{ github.run_number }})" \
            --notes "Debug build of commit ${{ github.sha }}. Download MeetingScribe-debug.apk on the phone and install it (allow installs from this source when asked)." \
            --latest
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: MeetingScribe/app/build/reports
          if-no-files-found: ignore
